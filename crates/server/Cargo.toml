edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["simulated"]
# The simulation endpoint behind the Simulated Driver's panel.
simulated = ["dep:gantry-driver-simulated"]

[dependencies]
