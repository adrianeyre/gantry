# The Tauri desktop app (desktop/, ADR-0008): its checks, then unsigned
# installers for Windows (NSIS and MSI), macOS (arm64 .dmg and .app) and Linux
# (.deb and AppImage), uploaded as workflow artifacts. See docs/desktop.md.
#
# It runs on a pull request that changes the desktop app (its checks aren't
# part of ci.yml, which needs no WebKitGTK), by hand, or called by
# release.yml, which passes the release's version and commit and attaches the
# installers to the GitHub Release. They are unsigned until #77.
name: Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The release's version, built into the installers. Empty for the desktop app's own.
        type: string
        default: ""
      ref:
        description: The commit to build. Empty for the one that triggered the run.
        type: string
        default: ""

# Called by Release, github.workflow is "Release", so a release's build never
# cancels (or is cancelled by) a pull request's or a manual run's.
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # What Tauri needs on Linux: WebKitGTK and friends.
  LINUX_PACKAGES: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
    librsvg2-dev libxdo-dev libssl-dev patchelf file

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      # The embedded server embeds web/dist, so the frontend is built first.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gantry/web build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Checks
        working-directory: desktop/src-tauri
        env:
          GANTRY_SKIP_WEB_BUILD: "1"
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  installers:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: windows-x64
            bundles: nsis,msi
          - runner: macos-14
            name: macos-arm64
            bundles: app,dmg
          - runner: ubuntu-22.04
            name: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.name }}
      # Unsigned: code signing is not set up yet (PRD §11). The frontend is
      # built by tauri.conf.json's beforeBuildCommand. For a release, the
      # installers are given the release's version: GANTRY_VERSION for the
      # embedded server and the dashboard's footer, and a --config override
      # for the installers' own. An MSI version can only be numbers, so a
      # pre-release (1.2.0-rc.1) gives the MSI just 1.2.0.
      - name: Build the installers
        working-directory: desktop
        shell: bash
        env:
          GANTRY_VERSION: ${{ inputs.version }}
        run: |
          args=(--ci --bundles "${{ matrix.bundles }}")
          if [ -n "$GANTRY_VERSION" ]; then
            config="{\"version\":\"$GANTRY_VERSION\""
            if [[ "$GANTRY_VERSION" == *-* ]]; then
              config+=",\"bundle\":{\"windows\":{\"wix\":{\"version\":\"${GANTRY_VERSION%%-*}\"}}}"
            fi
            config+="}"
            echo "$config" > "$RUNNER_TEMP/release.json"
            args+=(--config "$RUNNER_TEMP/release.json")
          fi
          pnpm tauri build "${args[@]}" -- --locked
      - name: List them
        shell: bash
        run: find desktop/src-tauri/target/release/bundle -maxdepth 2 -type f -exec ls -l {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
