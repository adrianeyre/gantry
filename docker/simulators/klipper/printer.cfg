# Gantry's Klipper simulator config: the mainsail-crew virtual-klipper-printer
# image's own printer.cfg, made lighter so its simulated MCU (simulavr) keeps up
# on an ordinary development machine. Mounted over the image's printer.cfg by
# compose.yaml. See docs/processes/testing-drivers-with-simulators.md.
#
# Changes from the image's config:
# - addons/miscellaneous.cfg is left out. Its software-PWM fans and pins load
#   the simulated MCU until Klipper shuts down with "Timer too close".
# - addons/timelapse.cfg is left out (it needs the timelapse plugin).
# - One [fan] (the part fan, which M106 sets) is put back on its own.
# - [force_move] is on, so a test's G-code can mark the axes homed with
#   SET_KINEMATIC_POSITION: simulavr's endstops never trigger, so G28 can't.

# This file contains example pin mappings for testing with the
# "simulavr" program. To use this config, compile the firmware for an
# AVR atmega644p, enable "low-level configuration options", and enable
# "simulavr software emulation". Further details are in
# docs/Debugging.md.

# See docs/Config_Reference.md for a description of parameters.

# AVR atmega644p Pins:
# PA0, PA1, PA2, PA3, PA4, PA5, PA6, PA7
# PB0, PB1, PB2, PB3, PB4, PB5, PB6, PB7
# PC0, PC1, PC2, PC3, PC4, PC5, PC6, PC7
# PD0, PD1, PD2, PD3, PD4, PD5, PD6, PD7

############################################
###   DO NOT CHANGE PIN ASSIGNMENTS !!!  ###
############################################
# Basic configurations (safe / required to use)
[include addons/basic_cartesian_kinematics.cfg]
[include addons/basic_macros.cfg]

# Extruder configuration (only one config allowed at a time)
[include addons/single_extruder.cfg]
#[include addons/dual_extruder.cfg]
#[include addons/dual_extruder_stepper.cfg]

# Other temperature sensors (only one config allowed at a time)
[include addons/heater_bed.cfg]
#[include addons/temp_sensors.cfg]

# Miscellaneous (only one active config allowed at a time)
#[include addons/miscellaneous.cfg] # [fan], [heater_fan], [controller_fan], [filament_runout_sensor], [output_pin]
#[include addons/led_neopixel.cfg] # [neopixel], [led]

# Moonraker Plugins
#[include addons/timelapse.cfg]

############################################
###       ADDITIONAL CONFIGURATIONS      ###
############################################
[respond]
[pause_resume]
[display_status]
[exclude_object]

[mcu]
serial: /tmp/pseudoserial
restart_method: arduino

[virtual_sdcard]
path: ~/printer_data/gcodes

[firmware_retraction]
retract_length: 0.5
retract_speed: 75
unretract_speed: 75

############################################
###               BED MESH               ###
############################################
[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 225, 225
probe_count: 5, 5

############################################
###        GANTRY'S TEST ADDITIONS       ###
############################################
[force_move]
enable_force_move: True

[fan]
pin: PB4
